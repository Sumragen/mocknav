<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body.state-loading .home-content { opacity: .35; pointer-events: none; }
  body.state-loading::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(250, 250, 248, .5);
  }
</style>
</head>
<body class="relative bg-stone-50 text-stone-900 antialiased">

<nav class="flex h-14 items-center gap-8 border-b border-stone-200 bg-white px-6">
  <span class="text-base font-bold">Demo</span>
  <div class="flex flex-1 gap-6 text-sm text-stone-500">
    <a href="#" class="hover:text-stone-900">Product</a>
    <a href="#" class="hover:text-stone-900">Pricing</a>
    <a href="#" class="hover:text-stone-900">Docs</a>
  </div>
  <button class="rounded-lg bg-stone-900 px-4 py-2 text-sm text-white">Get started</button>
</nav>

<div class="home-content">
  <section class="mx-auto max-w-xl px-6 py-20 text-center">
    <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">Mockup preview</h1>
    <p class="mt-4 text-stone-500">Static HTML + Tailwind CDN. Styled with utility classes, no build step.</p>
    <div class="mt-8 flex flex-wrap justify-center gap-3">
      <button class="rounded-lg bg-stone-900 px-6 py-2.5 text-sm text-white">Primary action</button>
      <button class="rounded-lg border border-stone-300 px-6 py-2.5 text-sm">Secondary</button>
    </div>
  </section>

  <div class="mx-auto grid max-w-3xl gap-4 px-6 pb-20 sm:grid-cols-3">
    <div class="rounded-xl border border-stone-200 bg-white p-5">
      <p class="text-xl">📄</p>
      <h3 class="mt-2 text-sm font-semibold">Plain HTML</h3>
      <p class="mt-1 text-sm text-stone-500">Each page is a normal file in your repo.</p>
    </div>
    <div class="rounded-xl border border-stone-200 bg-white p-5">
      <p class="text-xl">🎨</p>
      <h3 class="mt-2 text-sm font-semibold">Tailwind CDN</h3>
      <p class="mt-1 text-sm text-stone-500">Add the script tag — no PostCSS config.</p>
    </div>
    <div class="rounded-xl border border-stone-200 bg-white p-5">
      <p class="text-xl">↔</p>
      <h3 class="mt-2 text-sm font-semibold">States</h3>
      <p class="mt-1 text-sm text-stone-500">Switch Default / Loading in the toolbar.</p>
    </div>
  </div>
</div>

<script>
  const s = new URLSearchParams(location.search).get('state');
  if (s) document.body.classList.add('state-' + s);
</script>
</body>
</html>
