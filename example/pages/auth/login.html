<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font: 14px/1.6 -apple-system, 'Segoe UI', system-ui, sans-serif;
  color: #181816;
  background: #fafaf8;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.login-card {
  width: 100%;
  max-width: 360px;
  background: #fff;
  border: 1px solid #e8e6e2;
  border-radius: 16px;
  padding: 32px;
}

.login-card h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.login-subtitle { color: #6b6b67; font-size: 13px; margin-bottom: 28px; }

.login-field { margin-bottom: 14px; }
.login-field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
.login-field input {
  width: 100%;
  font: 14px/1 inherit;
  padding: 9px 12px;
  border: 1px solid #d4d2ce;
  border-radius: 8px;
  background: #fff;
  color: #181816;
  outline: none;
}
.login-field input:focus { border-color: #181816; }

.login-row { display: flex; justify-content: space-between; align-items: baseline; }
.login-forgot { font-size: 12px; color: #6b6b67; text-decoration: none; }

.login-error {
  display: none;
  font-size: 12px;
  color: #c03030;
  margin-top: 5px;
}

.login-submit {
  width: 100%;
  padding: 11px;
  margin-top: 6px;
  background: #181816;
  color: #fff;
  border: none;
  border-radius: 9px;
  font: 14px/1 inherit;
  font-weight: 500;
  cursor: pointer;
}

.login-or {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 18px 0;
  font-size: 12px;
  color: #9a9a95;
}
.login-or::before, .login-or::after { content: ''; flex: 1; height: 1px; background: #e8e6e2; }

.login-google {
  width: 100%;
  padding: 10px;
  background: transparent;
  border: 1px solid #d4d2ce;
  border-radius: 9px;
  font: 13px/1 inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: #181816;
}

.login-foot { text-align: center; margin-top: 20px; font-size: 13px; color: #6b6b67; }
.login-foot a { color: #181816; }

/* ── states ── */

body.state-error .login-field input[type=password] { border-color: #e24b4a; background: #fff8f8; }
body.state-error .login-error { display: block; }

body.state-loading .login-submit { opacity: .5; pointer-events: none; }
body.state-loading .login-submit::after { content: '…'; }
</style>
</head>
<body>
<div class="login-card">
  <h1>Welcome back</h1>
  <p class="login-subtitle">Sign in to your account</p>

  <div class="login-field">
    <label>Email</label>
    <input type="email" value="jane@example.com">
  </div>

  <div class="login-field">
    <div class="login-row">
      <label>Password</label>
      <a class="login-forgot" href="#">Forgot?</a>
    </div>
    <input type="password" value="hunter2">
    <div class="login-error">Incorrect password. Please try again.</div>
  </div>

  <button class="login-submit">Sign in</button>

  <div class="login-or">or</div>

  <button class="login-google">
    <svg width="15" height="15" viewBox="0 0 18 18">
      <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.258h2.908C16.658 14.013 17.64 11.706 17.64 9.2z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
      <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
      <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
    </svg>
    Continue with Google
  </button>

  <p class="login-foot">No account? <a href="#">Sign up</a></p>
</div>

<script>
  const s = new URLSearchParams(location.search).get('state');
  if (s) document.body.classList.add('state-' + s);
</script>
</body>
</html>
