<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .login-error { display: none; }
  body.state-error .login-error { display: block; }
  body.state-error .login-password { border-color: #e24b4a; background: #fff8f8; }
  body.state-loading .login-submit { opacity: .5; pointer-events: none; }
</style>
</head>
<body class="flex min-h-screen items-center justify-center bg-stone-50 p-6 antialiased">

<div class="w-full max-w-sm rounded-2xl border border-stone-200 bg-white p-8">
  <h1 class="text-xl font-bold">Welcome back</h1>
  <p class="mt-1 text-sm text-stone-500">Sign in to your account</p>

  <div class="mt-7 space-y-3.5">
    <div>
      <label class="mb-1 block text-xs font-semibold">Email</label>
      <input type="email" value="jane@example.com"
        class="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm outline-none focus:border-stone-900">
    </div>

    <div>
      <div class="mb-1 flex items-baseline justify-between">
        <label class="text-xs font-semibold">Password</label>
        <a href="#" class="text-xs text-stone-500 hover:text-stone-900">Forgot?</a>
      </div>
      <input type="password" value="hunter2"
        class="login-password w-full rounded-lg border border-stone-300 px-3 py-2 text-sm outline-none focus:border-stone-900">
      <p class="login-error mt-1 text-xs text-red-600">Incorrect password. Please try again.</p>
    </div>
  </div>

  <button class="login-submit mt-2 w-full rounded-lg bg-stone-900 py-2.5 text-sm font-medium text-white">
    Sign in
  </button>

  <div class="my-4 flex items-center gap-2 text-xs text-stone-400">
    <span class="h-px flex-1 bg-stone-200"></span>
    or
    <span class="h-px flex-1 bg-stone-200"></span>
  </div>

  <button class="flex w-full items-center justify-center gap-2 rounded-lg border border-stone-300 py-2.5 text-sm">
    <svg width="15" height="15" viewBox="0 0 18 18" aria-hidden="true">
      <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.258h2.908C16.658 14.013 17.64 11.706 17.64 9.2z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
      <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
      <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
    </svg>
    Continue with Google
  </button>

  <p class="mt-5 text-center text-sm text-stone-500">
    No account? <a href="#" class="text-stone-900 underline-offset-2 hover:underline">Sign up</a>
  </p>
</div>

<script>
  const s = new URLSearchParams(location.search).get('state');
  if (s) document.body.classList.add('state-' + s);
</script>
</body>
</html>
